name: Release Gate

on:
  push:
    branches: ["master", "release/**"]
  pull_request:
    branches: ["master", "release/**"]

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    uses: ./.github/workflows/qa-ci.yml

  security:
    uses: ./.github/workflows/security-ci.yml

  gate:
    runs-on: ubuntu-latest
    needs: [qa, security]
    steps:
      - name: Gate passed
        run: |
          echo "Release gate OK: QA + Security completados."
