name: QA CI (Gates 1–3)

on:
  push:
    branches: ["master", "release/**"]
  pull_request:

concurrency:
  group: qa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare .env for Docker Compose
        run: |
          cp .env.example .env

      - name: Run repo comment audit (PR)
        if: github.event_name == 'pull_request'
        run: |
          make qa-repo-comment-audit REPO_AUDIT_FETCH=1

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Setup backend stack (fresh)
        run: |
          make QA_FRESH_DB=1 qa-ci-up

      - name: Preflight checks
        run: |
          make qa-ci-preflight

      - name: Frontend quality checks
        run: |
          make qa-frontend-quality

      - name: Publish preflight summary
        if: always()
        run: |
          {
            echo "## QA Preflight";
            echo "- Workflow run: [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})";
            echo "- Artifact: \`qa-reports-preflight\`";
            if [ -f qa/reports/repo_comment_audit.md ]; then
              echo "";
              echo "### Repo comment audit";
              cat qa/reports/repo_comment_audit.md;
            fi
            if [ -f qa/reports/repo_comment_audit.json ]; then
              echo "";
              echo "### Repo comment audit (classification)";
              python3 -c 'import json; from pathlib import Path; d = json.loads(Path("qa/reports/repo_comment_audit.json").read_text(encoding="utf-8")); status = str(d.get("status", "UNKNOWN")); mode = str(d.get("sync_origin_mode", "strict")); reason = str(d.get("sync_origin_reason_code", "UNKNOWN")); classification = ("warning de contexto PR detached (no bloqueante por sí solo)" if reason.startswith("PR_DETACHED_") else ("fallo bloqueante real" if status == "FAIL" else "sin warning contextual PR")); print(f"- status: `{status}`"); print(f"- sync_origin_mode: `{mode}`"); print(f"- sync_origin_reason_code: `{reason}`"); print(f"- clasificación: **{classification}**")'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preflight reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-preflight
          path: qa/reports/
          if-no-files-found: warn

      - name: Backend logs (on failure)
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose ps || true
            docker compose logs --no-color --timestamps backend db | tail -n 400 || true
          else
            echo "[qa-ci] .env missing; skipping docker diagnostics."
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down -v --remove-orphans || true
          else
            echo "[qa-ci] .env missing; skipping docker compose down."
          fi

  frontend-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env for Docker Compose
        run: |
          cp .env.example .env

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Run frontend bundle budget gate
        run: |
          make qa-frontend-bundle-budget

      - name: Publish bundle summary
        if: always()
        run: |
          {
            echo "## Frontend Bundle Budget";
            echo "- Workflow run: [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})";
            echo "- Artifact: \`qa-reports-frontend-budget\`";
            if [ -f qa/reports/frontend_bundle_budget.md ]; then
              echo "";
              cat qa/reports/frontend_bundle_budget.md;
            else
              echo "";
              echo "- No se encontró \`qa/reports/frontend_bundle_budget.md\`";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend budget reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-frontend-budget
          path: qa/reports/
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down -v --remove-orphans || true
          else
            echo "[qa-ci] .env missing; skipping docker compose down."
          fi

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env for Docker Compose
        run: |
          cp .env.example .env

      - name: Setup backend stack (fresh)
        run: |
          make QA_FRESH_DB=1 qa-ci-up

      - name: Backend tests with coverage
        run: |
          make qa-backend-tests
          make qa-coverage-domains
          make qa-reports-contract-check

      - name: Publish backend tests summary
        if: always()
        run: |
          {
            echo "## Backend Tests & Coverage";
            echo "- Workflow run: [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})";
            echo "- Artifact: \`qa-reports-backend-tests\`";
            if [ -f qa/reports/coverage_by_domain.md ]; then
              echo "";
              cat qa/reports/coverage_by_domain.md;
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-backend-tests
          path: qa/reports/
          if-no-files-found: warn

      - name: Backend logs (on failure)
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose ps || true
            docker compose logs --no-color --timestamps backend db | tail -n 400 || true
          else
            echo "[qa-ci] .env missing; skipping docker diagnostics."
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down -v --remove-orphans || true
          else
            echo "[qa-ci] .env missing; skipping docker compose down."
          fi

  audit-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env for Docker Compose
        run: |
          cp .env.example .env

      - name: Setup backend stack (fresh)
        run: |
          make QA_FRESH_DB=1 qa-ci-up

      - name: Audit integrity gate
        run: |
          make qa-audit-integrity

      - name: Publish audit summary
        if: always()
        run: |
          {
            echo "## Audit Integrity";
            echo "- Workflow run: [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})";
            echo "- Artifact: \`qa-reports-audit-integrity\`";
            if [ -f qa/reports/audit_integrity.json ]; then
              echo "";
              echo "- Archivo generado: \`qa/reports/audit_integrity.json\`";
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-audit-integrity
          path: qa/reports/
          if-no-files-found: warn

      - name: Backend logs (on failure)
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose ps || true
            docker compose logs --no-color --timestamps backend db | tail -n 400 || true
          else
            echo "[qa-ci] .env missing; skipping docker diagnostics."
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down -v --remove-orphans || true
          else
            echo "[qa-ci] .env missing; skipping docker compose down."
          fi
