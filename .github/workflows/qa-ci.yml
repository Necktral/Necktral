name: QA CI (Gates 1–3)

on:
  push:
    branches: ["master", "release/**"]
  pull_request:
  workflow_call:

concurrency:
  group: qa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Run repo comment audit (PR)
        if: github.event_name == 'pull_request'
        run: |
          make qa-repo-comment-audit REPO_AUDIT_FETCH=1

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Prepare .env for Docker Compose
        run: |
          cp .env.example .env

      - name: Run QA gates (deterministic)
        run: |
          make qa-ci-ci

      - name: Publish repo audit summary (PR)
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f qa/reports/repo_comment_audit.md ]; then
            cat qa/reports/repo_comment_audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se encontró qa/reports/repo_comment_audit.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-reports
          path: qa/reports/
          if-no-files-found: warn

      - name: Backend logs (on failure)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --timestamps backend db | tail -n 400

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans
