services:
  influxdb:
    image: influxdb@sha256:299ebda2c7e308dbef42e26ac9b8fd1d9b3bcb8a0aee80c6509aa0219c1d0290
    container_name: k6_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
    volumes:
      - k6_influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD-SHELL", "influx -host 127.0.0.1 -execute 'SHOW DATABASES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - necktral_net

  grafana:
    image: grafana/grafana@sha256:ba93c9d192e58b23e064c7f501d453426ccf4a85065bf25b705ab1e98602bfb1
    container_name: k6_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ./grafana-dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - k6_grafana_data:/var/lib/grafana
    networks:
      - necktral_net
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q '\"database\"[[:space:]]*:[[:space:]]*\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

networks:
  necktral_net:
    external: true
    name: erp_crm_default

volumes:
  k6_influxdb_data:
  k6_grafana_data:
